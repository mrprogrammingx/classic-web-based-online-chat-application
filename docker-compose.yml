services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      TEST_MODE: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    volumes:
      - ./auth.db:/app/auth.db
